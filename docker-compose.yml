services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: aprobaciones-db
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
    ports:
      # Puerto de host distinto al de Jimaco Cotizaciones (1433) para poder correr ambos stacks
      # a la vez en el mismo equipo de desarrollo sin choque de puertos.
      - "127.0.0.1:1434:1433"
    volumes:
      - aprobaciones-db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Jimaco.Aprobaciones.Api/Dockerfile
    container_name: aprobaciones-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: Server=db,1433;Database=JimacoAprobaciones;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: Jimaco.Aprobaciones
      Jwt__Audience: Jimaco.Aprobaciones
      Jwt__ExpiracionMinutos: "480"
      Cors__AllowedOrigins__0: http://localhost:4201
      Almacenamiento__RutaAdjuntos: /adjuntos
    volumes:
      - aprobaciones-adjuntos:/adjuntos
    ports:
      - "8081:8080"

  web:
    build:
      context: ../Jimaco.Aprobaciones.Web
      dockerfile: Dockerfile
    container_name: aprobaciones-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "4201:8080"

volumes:
  aprobaciones-db-data:
  aprobaciones-adjuntos:
